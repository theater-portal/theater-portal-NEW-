version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: theater_db
    environment:
      POSTGRES_USER: theater_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: theater_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: theater_backend
    environment:
      DATABASE_URL: postgresql://theater_admin:secure_password@postgres:5432/theater_portal
      JWT_SECRET: super_secret_key
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: theater_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
